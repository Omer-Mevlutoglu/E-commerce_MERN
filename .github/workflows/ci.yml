name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      # The suite starts its own in-memory replica set, so no MongoDB service
      # container is needed — and transactions still work.
      - name: Test
        working-directory: backend
        run: npm run test:coverage

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm run test:coverage

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      API_PORT: 3098
      WEB_PORT: 4173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      # A standalone mongod has no transactions, so checkout exercises the
      # compensating-write fallback here. The transactional path is covered by
      # the backend job's in-memory replica set.
      - name: Start API
        working-directory: backend
        env:
          NODE_ENV: production
          PORT: 3098
          DATABASE_URL: mongodb://localhost:27017/laptopia_e2e
          JWT_SECRET: ci-secret-that-is-definitely-long-enough-32
          CORS_ORIGIN: http://localhost:4173
          SEED_DEMO_USERS: "true"
        run: |
          node dist/index.js &
          npx wait-on http://localhost:3098/health --timeout 60000

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_BASE_URL: http://localhost:3098
        run: npm run build

      - name: Run E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
